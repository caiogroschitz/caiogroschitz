[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-jusbrasil"
version = "1.0.0"
description = "MCP server for authenticated Jusbrasil jurisprudence collection"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "python-docx>=1.1.0",
]

[project.scripts]
mcp-jusbrasil = "src.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
